name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  # Called by publish.yml, so nothing reaches npm without this passing.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Most of src/ is generated from scripts/. Editing the mapping and
      # forgetting to regenerate would otherwise pass every other check and
      # ship a set that does not match what the mapping says.
      - name: Generated icons are up to date
        run: |
          pnpm generate
          if ! git diff --quiet; then
            echo "::error::src/ is out of date — run 'pnpm generate' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and format
        run: pnpm check

      - name: Build
        run: pnpm build
